[project]
name = "codebase-oracle"
version = "26.9.21"
description = "Timeline-as-truth event index over one codebase: git commits, GitHub issue/PR transitions, submodule bumps."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lancedb>=0.26",
    "pydantic>=2.9",
    "pyarrow>=17",
]

[project.scripts]
cbo = "codebase_oracle.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# No `python_version` pin on purpose. Pinning 3.11 while the venv runs 3.12 made mypy
# parse numpy's stubs under the older grammar and abort with a syntax error before it
# checked a single line of our code. Following the running interpreter is correct.
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# LanceDB ships no type information, so every table handle is genuinely Any. Naming
# that here keeps it to ONE declared boundary instead of scattering `# type: ignore`
# through store.py, which is how a checker stops being read.
[[tool.mypy.overrides]]
module = ["lancedb.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
