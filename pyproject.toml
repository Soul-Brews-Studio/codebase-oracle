[project]
name = "codebase-oracle"
version = "26.9.21"
description = "Timeline-as-truth event index over one codebase: git commits, GitHub issue/PR transitions, submodule bumps."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lancedb>=0.26",
    "pydantic>=2.9",
    "pyarrow>=17",
]

[project.scripts]
cbo = "codebase_oracle.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
